name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/tests.yml
    # Pass CODECOV_TOKEN through; reusable workflows get no secrets otherwise.
    secrets: inherit

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      # Versions are pinned so a new upstream major cannot break releases.
      # conventional-changelog-conventionalcommits 10+ needs conventional-changelog-writer 9,
      # but @semantic-release/release-notes-generator 14 still ships writer 8.
      - name: Install semantic-release & plugins
        run: |
          npm install --no-save \
            semantic-release@25.0.9 \
            @semantic-release/changelog@7.0.0 \
            @semantic-release/git@11.0.1 \
            @semantic-release/github@12.0.10 \
            conventional-changelog-conventionalcommits@9.3.1

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
